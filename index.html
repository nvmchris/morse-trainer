<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Morse Trainer</title>
    <meta
      name="description"
      content="Learn and practise Morse code: letters, numbers, signs and words."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='8' cy='16' r='5' fill='%23e8a33d'/><rect x='16' y='12' width='14' height='8' rx='4' fill='%23e8a33d'/></svg>"
    />
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="src/app.js"></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#practice"
        ><span class="brand-mark" aria-hidden="true">·−</span> Morse Trainer</a
      >
      <nav class="tabs" aria-label="Sections">
        <a href="#learn" data-view="learn">Learn</a>
        <a href="#practice" data-view="practice">Practice</a>
        <a href="#cheatsheet" data-view="cheatsheet">Cheatsheet</a>
      </nav>
      <div class="settings">
        <label>
          Speed <output id="wpm-value">12</output> WPM
          <input id="wpm" type="range" min="5" max="35" step="1" value="12" />
        </label>
        <label class="check"><input id="sound" type="checkbox" checked /> Sound</label>
      </div>
    </header>
    <main>
      <section id="view-learn" hidden></section>
      <section id="view-practice" hidden></section>
      <section id="view-cheatsheet" hidden>
        <h2>Cheatsheet</h2>
        <p class="muted">Click any code to hear it.</p>
      </section>
    </main>
    <footer class="muted">
      <a href="https://github.com/nvmchris/morse-trainer">Source on GitHub</a>
    </footer>
  </body>
</html>
